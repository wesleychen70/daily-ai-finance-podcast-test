name: One-off public media compatibility test
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: daily-finance-test
  cancel-in-progress: false
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      PYTHONPATH: .
      PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/transport_smoke.py
        env:
          SMOKE_STAGE: prepare
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
      - run: python scripts/transport_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-proof
          path: build/*json
